<svg xmlns="http://www.w3.org/2000/svg" width="800" height="800" viewBox="0 0 800 800" fill="none">
  <defs>
    <style>
      .cook-icon {
        stroke: rgba(255, 183, 77, 0.18);
        stroke-width: 1.5;
        stroke-linecap: round;
        stroke-linejoin: round;
        fill: none;
      }
    </style>

    <!-- Bowl of noodles -->
    <symbol id="noodles" viewBox="0 0 64 64">
      <g class="cook-icon">
        <ellipse cx="32" cy="44" rx="22" ry="8"/>
        <path d="M10 44c0-16 10-28 22-28s22 12 22 28"/>
        <path d="M18 36c4-6 10-8 14-4s2 10-6 12"/>
        <path d="M28 32c3-5 8-6 12-2"/>
        <path d="M38 34c4-4 9-3 12 2"/>
        <path d="M48 22l10-8M52 12v8"/>
        <path d="M44 20l8-6"/>
      </g>
    </symbol>

    <!-- Chili pepper -->
    <symbol id="chili" viewBox="0 0 64 64">
      <g class="cook-icon">
        <path d="M34 12c-2 14-2 26 0 40M30 12c2 14 2 26 0 40M26 14c-2 10-2 20 0 28"/>
        <path d="M22 54c6 6 12 6 18 0"/>
        <path d="M36 10c2-4 8-6 12-2"/>
      </g>
    </symbol>

    <!-- Chef hat -->
    <symbol id="chef-hat" viewBox="0 0 64 64">
      <g class="cook-icon">
        <path d="M12 40c0-14 8-26 20-26s20 12 20 26"/>
        <path d="M8 40h48v8c0 6-10 10-24 10S8 54 8 48v-8z"/>
        <path d="M20 28c4-6 10-8 16-4"/>
      </g>
    </symbol>

    <!-- Rolling pin -->
    <symbol id="rolling-pin" viewBox="0 0 64 64">
      <g class="cook-icon">
        <rect x="14" y="26" width="36" height="12" rx="6"/>
        <path d="M14 32H6M50 32h8"/>
      </g>
    </symbol>

    <!-- Spoon & fork -->
    <symbol id="utensils" viewBox="0 0 64 64">
      <g class="cook-icon">
        <path d="M22 10c0 10-2 16-2 24v18M20 10c2 8 2 14 2 22"/>
        <ellipse cx="22" cy="54" rx="4" ry="3"/>
        <path d="M40 10v16M36 10v12M40 10v12M44 10v12"/>
        <path d="M36 50h12"/>
      </g>
    </symbol>

    <!-- Cooking pot -->
    <symbol id="pot" viewBox="0 0 64 64">
      <g class="cook-icon">
        <path d="M14 36c0-14 9-24 18-24s18 10 18 24v14H14V36z"/>
        <path d="M10 36h44"/>
        <path d="M20 50h24"/>
        <path d="M8 32h6M50 32h6"/>
        <path d="M26 16c0-6 3-10 6-6M38 14c0-5 3-8 6-4"/>
      </g>
    </symbol>

    <!-- Garlic -->
    <symbol id="garlic" viewBox="0 0 64 64">
      <g class="cook-icon">
        <ellipse cx="32" cy="38" rx="14" ry="18"/>
        <path d="M26 22c2-8 8-12 12-6s2 12-4 14"/>
        <path d="M38 22c-2-8-8-12-12-6"/>
        <path d="M32 18v-6"/>
      </g>
    </symbol>

    <!-- Herbs / leaves -->
    <symbol id="herbs" viewBox="0 0 64 64">
      <g class="cook-icon">
        <path d="M32 54V22"/>
        <path d="M32 30c-10-4-16-12-14-20 8 2 14 10 14 20"/>
        <path d="M32 38c10-4 18-12 16-22-10 2-16 12-16 22"/>
        <path d="M32 46c-6-2-10-6-10-10 6 0 10 4 10 10"/>
      </g>
    </symbol>

    <!-- Rice bowl -->
    <symbol id="rice-bowl" viewBox="0 0 64 64">
      <g class="cook-icon">
        <ellipse cx="32" cy="46" rx="20" ry="7"/>
        <path d="M12 46c0-14 9-24 20-24s20 10 20 24"/>
        <path d="M18 38c6-2 12-2 18 0"/>
        <path d="M22 34c4-1 8-1 12 0"/>
        <path d="M26 30c3-1 6-1 9 0"/>
      </g>
    </symbol>

    <!-- Spice jar -->
    <symbol id="spice-jar" viewBox="0 0 64 64">
      <g class="cook-icon">
        <rect x="20" y="24" width="24" height="28" rx="3"/>
        <path d="M18 24h28v-6c0-4-6-6-14-6s-14 2-14 6v6z"/>
        <path d="M26 36h12M26 42h12"/>
        <circle cx="32" cy="30" r="2" fill="rgba(255,183,77,0.18)" stroke="none"/>
      </g>
    </symbol>
  </defs>

  <!-- Row 1 -->
  <use href="#noodles" width="64" height="64" transform="translate(48 36) rotate(-14) scale(0.55)"/>
  <use href="#chili" width="64" height="64" transform="translate(220 52) rotate(18) scale(0.42)"/>
  <use href="#chef-hat" width="64" height="64" transform="translate(390 28) rotate(-8) scale(0.72)"/>
  <use href="#herbs" width="64" height="64" transform="translate(580 44) rotate(22) scale(0.48)"/>
  <use href="#pot" width="64" height="64" transform="translate(700 68) rotate(-16) scale(0.38)"/>

  <!-- Row 2 -->
  <use href="#rolling-pin" width="64" height="64" transform="translate(120 160) rotate(25) scale(0.65)"/>
  <use href="#rice-bowl" width="64" height="64" transform="translate(310 140) rotate(-10) scale(0.58)"/>
  <use href="#garlic" width="64" height="64" transform="translate(500 170) rotate(12) scale(0.5)"/>
  <use href="#spice-jar" width="64" height="64" transform="translate(660 150) rotate(-20) scale(0.62)"/>
  <use href="#utensils" width="64" height="64" transform="translate(24 200) rotate(-6) scale(0.45)"/>

  <!-- Row 3 -->
  <use href="#chili" width="64" height="64" transform="translate(180 290) rotate(-18) scale(0.7)"/>
  <use href="#noodles" width="64" height="64" transform="translate(420 270) rotate(8) scale(0.4)"/>
  <use href="#herbs" width="64" height="64" transform="translate(600 300) rotate(-12) scale(0.55)"/>
  <use href="#chef-hat" width="64" height="64" transform="translate(720 320) rotate(15) scale(0.35)"/>
  <use href="#pot" width="64" height="64" transform="translate(60 340) rotate(10) scale(0.52)"/>

  <!-- Row 4 -->
  <use href="#spice-jar" width="64" height="64" transform="translate(250 400) rotate(-22) scale(0.48)"/>
  <use href="#utensils" width="64" height="64" transform="translate(480 390) rotate(6) scale(0.68)"/>
  <use href="#rolling-pin" width="64" height="64" transform="translate(640 410) rotate(-14) scale(0.44)"/>
  <use href="#rice-bowl" width="64" height="64" transform="translate(100 430) rotate(20) scale(0.38)"/>
  <use href="#garlic" width="64" height="64" transform="translate(360 440) rotate(-8) scale(0.6)"/>

  <!-- Row 5 -->
  <use href="#chef-hat" width="64" height="64" transform="translate(520 520) rotate(12) scale(0.5)"/>
  <use href="#noodles" width="64" height="64" transform="translate(700 500) rotate(-10) scale(0.58)"/>
  <use href="#herbs" width="64" height="64" transform="translate(40 540) rotate(16) scale(0.42)"/>
  <use href="#chili" width="64" height="64" transform="translate(200 560) rotate(-24) scale(0.46)"/>
  <use href="#pot" width="64" height="64" transform="translate(380 550) rotate(8) scale(0.66)"/>

  <!-- Row 6 -->
  <use href="#garlic" width="64" height="64" transform="translate(580 620) rotate(-18) scale(0.4)"/>
  <use href="#spice-jar" width="64" height="64" transform="translate(120 640) rotate(14) scale(0.54)"/>
  <use href="#utensils" width="64" height="64" transform="translate(300 660) rotate(-6) scale(0.36)"/>
  <use href="#rolling-pin" width="64" height="64" transform="translate(460 630) rotate(22) scale(0.5)"/>
  <use href="#rice-bowl" width="64" height="64" transform="translate(660 660) rotate(-12) scale(0.48)"/>

  <!-- Row 7 / fill gaps -->
  <use href="#herbs" width="64" height="64" transform="translate(740 720) rotate(8) scale(0.52)"/>
  <use href="#noodles" width="64" height="64" transform="translate(520 720) rotate(-16) scale(0.42)"/>
  <use href="#chef-hat" width="64" height="64" transform="translate(280 720) rotate(10) scale(0.38)"/>
  <use href="#chili" width="64" height="64" transform="translate(80 720) rotate(-20) scale(0.5)"/>
  <use href="#pot" width="64" height="64" transform="translate(400 100) rotate(6) scale(0.36)"/>
</svg>
